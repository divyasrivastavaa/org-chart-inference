<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640"
     role="img" aria-labelledby="t">
  <title id="t">How Org Chart Inference works: data into the database, inference, decide, score and refresh</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a93a3"/></marker>
    <style>
      text { font-family: "Source Sans Pro", -apple-system, "Segoe UI", Roboto, sans-serif;
             fill: #1f2937; }
      .h  { font-size: 22px; font-weight: 700; }
      .s  { font-size: 16px; font-weight: 700; }
      .b  { font-size: 15px; font-weight: 700; }
      .t  { font-size: 12.5px; fill: #374151; }
      .m  { font-family: Consolas, "SFMono-Regular", Menlo, monospace; font-size: 11.5px;
            fill: #6b7280; }
      .mi { font-family: Consolas, "SFMono-Regular", Menlo, monospace; font-size: 11.5px;
            fill: #1f2937; }
      .blue   { fill: #eef3fd; stroke: #3b6fd1; }
      .purple { fill: #f3effc; stroke: #7c5cc4; }
      .green  { fill: #ebf7f0; stroke: #3f9b62; }
      rect.box { stroke-width: 1.3; }
      .ar { stroke: #8a93a3; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="1000" height="640" rx="12" fill="#ffffff"/>

  <text class="h" x="20" y="36">How Org Chart Inference works</text>

  <!-- 1 · Data -->
  <text class="s" x="20" y="72">1 · Data</text>
  <rect class="box blue" x="20" y="84" width="231" height="108" rx="8"/>
  <text class="b" x="34" y="108">Benchmark generator</text>
  <text class="m" x="34" y="126">generate_data.py</text>
  <text class="t" x="34" y="146">500 companies, messy titles,</text>
  <text class="t" x="34" y="162">answer key with every manager</text>
  <text class="t" x="34" y="178">seeds 42 (app), 7 (held out)</text>

  <rect class="box blue" x="263" y="84" width="231" height="108" rx="8"/>
  <text class="b" x="277" y="108">UK government organograms</text>
  <text class="m" x="277" y="126">scripts/build_uk.py</text>
  <text class="t" x="277" y="146">12 organisations, 2,281 posts</text>
  <text class="t" x="277" y="162">answer key: “reports to” column</text>
  <text class="t" x="277" y="178">Open Government Licence v3.0</text>

  <rect class="box blue" x="506" y="84" width="231" height="108" rx="8"/>
  <text class="b" x="520" y="108">ASX/NZX leadership</text>
  <text class="m" x="520" y="126">scripts/build_real.py</text>
  <text class="t" x="520" y="146">20 companies, 218 leaders</text>
  <text class="t" x="520" y="162">answer key: 43 lines confirmed</text>
  <text class="t" x="520" y="178">in the companies’ own sources</text>

  <rect class="box blue" x="749" y="84" width="231" height="108" rx="8"/>
  <text class="b" x="763" y="108">People Data Labs</text>
  <text class="m" x="763" y="126">scripts/pdl_load.py (cached)</text>
  <text class="t" x="763" y="146">50 senior people at 1 company,</text>
  <text class="t" x="763" y="162">with their job history</text>
  <text class="t" x="763" y="178">the app shows current job only</text>

  <path class="ar" d="M135 192 V214"/>
  <path class="ar" d="M378 192 V214"/>
  <path class="ar" d="M621 192 V214"/>
  <path class="ar" d="M864 192 V214"/>

  <rect class="box blue" x="20" y="216" width="960" height="58" rx="8"/>
  <text class="b" x="36" y="239">Supabase Postgres: the app reads and writes only here</text>
  <text class="m" x="440" y="239">scripts/load_db.py imports the CSVs once</text>
  <text class="t" x="36" y="261"><tspan class="mi">employments</tspan> job history, never overwritten  ·  <tspan class="mi">reporting_lines</tspan> written by the model  ·  <tspan class="mi">answer_key</tspan> never shown to the model  ·  <tspan class="mi">runs</tspan> time and cost</text>

  <!-- 2 · Inference -->
  <path class="ar" d="M232 274 V320"/>
  <text class="s" x="20" y="306">2 · Inference</text>
  <text class="m" x="128" y="306">infer.py</text>

  <rect class="box purple" x="20" y="322" width="225" height="124" rx="8"/>
  <text class="b" x="34" y="345">Title parsing</text>
  <text class="m" x="34" y="362">parse_title()</text>
  <text class="t" x="34" y="381">cleans “Sr. Mgr”, “SWE” …</text>
  <text class="t" x="34" y="397">level 1–8 (CEO … intern)</text>
  <text class="t" x="34" y="413">function: title words, else</text>
  <text class="t" x="34" y="429">the department or unit</text>

  <rect class="box purple" x="265" y="322" width="225" height="124" rx="8"/>
  <text class="b" x="279" y="345">Company context</text>
  <text class="m" x="279" y="362">fix_with_company_context()</text>
  <text class="t" x="279" y="381">finds the CEO (level 1)</text>
  <text class="t" x="279" y="397">3+ “managers” in a team → ICs</text>
  <text class="t" x="279" y="413">divisional CEOs → level 2</text>
  <text class="t" x="279" y="429">Director above Deputy Director</text>

  <rect class="box purple" x="510" y="322" width="225" height="124" rx="8"/>
  <text class="b" x="524" y="345">Manager search</text>
  <text class="m" x="524" y="362">infer_company()</text>
  <text class="t" x="524" y="381">same function (and team),</text>
  <text class="t" x="524" y="397">one level up, then climb</text>
  <text class="t" x="524" y="413">C-level → the CEO</text>
  <text class="t" x="524" y="429">0 or 2+ fit → abstain + reason</text>

  <rect class="box purple" x="755" y="322" width="225" height="124" rx="8"/>
  <text class="b" x="769" y="345">Confidence</text>
  <text class="m" x="769" y="362">models/confidence_tree.json</text>
  <text class="t" x="769" y="381">decision tree, 9 leaves, trained</text>
  <text class="t" x="769" y="397">on Benchmark seed 1</text>
  <text class="t" x="769" y="413">UK unit lines: share right per</text>
  <text class="t" x="769" y="429">step, measured on the tune half</text>

  <path class="ar" d="M245 384 H263"/>
  <path class="ar" d="M490 384 H508"/>
  <path class="ar" d="M735 384 H753"/>

  <!-- 3 · Decide, score and refresh -->
  <path class="ar" d="M812 446 V466 H270 V498"/>
  <path class="ar" d="M930 498 V448" stroke-dasharray="4 3"/>
  <text class="m" x="938" y="478">re-runs</text>
  <text class="s" x="20" y="490">3 · Decide, score and refresh</text>

  <rect class="box green" x="20" y="500" width="300" height="118" rx="8"/>
  <text class="b" x="36" y="524">Draw only if confidence ≥ 0.7</text>
  <text class="t" x="36" y="546">a wrong line costs about 2.3× a missing one,</text>
  <text class="t" x="36" y="562">so a line must be right ≥ 70% of the time</text>
  <text class="t" x="36" y="584">otherwise “not placed” + the reason</text>

  <rect class="box green" x="340" y="500" width="300" height="118" rx="8"/>
  <text class="b" x="356" y="524">Score</text>
  <text class="m" x="404" y="524">vs. answer_key</text>
  <text class="t" x="356" y="544">precision · coverage (from the database)</text>
  <text class="t" x="356" y="562">Benchmark seed 42: 95.8% prec., 63.1% cov.</text>
  <text class="t" x="356" y="578">held-out seed 7 (files): 95.4%, 63.7%</text>
  <text class="t" x="356" y="594">UK test half: 85.0%, 25.3%</text>
  <text class="t" x="356" y="610">ASX/NZX: 36 of 36 right, 84% coverage</text>

  <rect class="box green" x="660" y="500" width="320" height="118" rx="8"/>
  <text class="b" x="676" y="524">Changes and refresh</text>
  <text class="m" x="830" y="524">refresh.py</text>
  <text class="t" x="676" y="544">add · remove · promote · change job: saved</text>
  <text class="t" x="676" y="562">with history · reset demo data</text>
  <text class="t" x="676" y="580">only changed companies are re-inferred</text>
  <text class="t" x="676" y="598">each run logged: time, cost · Logfire</text>

  <path class="ar" d="M320 559 H338"/>
</svg>
